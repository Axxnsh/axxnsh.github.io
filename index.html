<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Velorah® — Where dreams rise through the silence. Digital spaces for sharp focus and inspired work.">
  <title>Velorah®</title>

  <!-- Google Fonts: Instrument Serif & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: 'hsl(var(--secondary))',
            accent: 'hsl(var(--accent))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
          },
          fontFamily: {
            display: ['var(--font-display)', 'serif'],
            body: ['var(--font-body)', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --font-display: 'Instrument Serif', serif;
      --font-body: 'Inter', sans-serif;

      --background: 201 100% 13%;
      --foreground: 0 0% 100%;
      --muted-foreground: 240 4% 66%;
      --primary: 0 0% 100%;
      --primary-foreground: 0 0% 4%;
      --secondary: 0 0% 10%;
      --muted: 0 0% 10%;
      --accent: 0 0% 10%;
      --border: 0 0% 18%;
      --input: 0 0% 18%;
    }

    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: var(--font-body);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Liquid Glass Effect */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Animations */
    @keyframes fade-rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
    .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }
    .animate-fade-rise-delay-2 { animation: fade-rise 0.8s ease-out 0.4s both; }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between antialiased">

  <!-- Fullscreen Video Background -->
  <video 
    autoplay 
    loop 
    muted 
    playsinline 
    class="absolute inset-0 w-full h-full object-cover z-0"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"
  ></video>

  <!-- Navigation Bar -->
  <header class="relative z-10 flex flex-row items-center justify-between px-8 py-6 max-w-7xl mx-auto w-full">
    <!-- Logo -->
    <a href="#" class="text-3xl tracking-tight text-foreground" style="font-family: 'Instrument Serif', serif;">
      Velorah<sup class="text-xs">®</sup>
    </a>

    <!-- Nav Links (hidden on mobile, md:flex) -->
    <nav class="hidden md:flex items-center space-x-8">
      <a href="#" class="text-sm text-foreground transition-colors font-medium">Home</a>
      <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors font-medium">Studio</a>
      <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors font-medium">About</a>
      <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors font-medium">Journal</a>
      <a href="#" class="text-sm text-muted-foreground hover:text-foreground transition-colors font-medium">Reach Us</a>
    </nav>

    <!-- CTA Button -->
    <button class="liquid-glass rounded-full px-6 py-2.5 text-sm text-foreground hover:scale-[1.03] transition-transform">
      Begin Journey
    </button>
  </header>

  <!-- Hero Section -->
  <main class="relative z-10 flex flex-col items-center justify-center text-center px-6 pt-32 pb-40 py-[90px] my-auto">
    <!-- H1 Heading -->
    <h1 
      class="text-5xl sm:text-7xl md:text-8xl leading-[0.95] tracking-[-2.46px] max-w-7xl font-normal text-foreground animate-fade-rise"
      style="font-family: 'Instrument Serif', serif;"
    >
      Where <em class="not-italic text-muted-foreground">dreams</em> rise <em class="not-italic text-muted-foreground">through the silence.</em>
    </h1>

    <!-- Subtext -->
    <p class="text-muted-foreground text-base sm:text-lg max-w-2xl mt-8 leading-relaxed animate-fade-rise-delay">
      We're designing tools for deep thinkers, bold creators, and quiet rebels. Amid the chaos, we build digital spaces for sharp focus and inspired work.
    </p>

    <!-- Hero CTA Button -->
    <button class="liquid-glass rounded-full px-14 py-5 text-base text-foreground mt-12 hover:scale-[1.03] cursor-pointer animate-fade-rise-delay-2">
      Begin Journey
    </button>
  </main>

  <!-- Footer placeholder to keep layout centered -->
  <footer class="relative z-10 py-4 text-center text-xs text-muted-foreground/40">
  </footer>

</body>
</html>
