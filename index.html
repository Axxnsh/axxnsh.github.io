      src: url("https://db.onlinewebfonts.com/t/5ac3fe7c6abd2f62067f266d89671492.eot?#iefix") format("embedded-opentype"),
           url("https://db.onlinewebfonts.com/t/5ac3fe7c6abd2f62067f266d89671492.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/5ac3fe7c6abd2f62067f266d89671492.woff") format("woff"),
           url("https://db.onlinewebfonts.com/t/5ac3fe7c6abd2f62067f266d89671492.ttf") format("truetype");
    }

    @font-face {
      font-family: 'HelveticaNowDisplayW01-Rg';
      src: url("https://db.onlinewebfonts.com/t/1aa3377e489837a26d019bba501e779d.eot");
      src: url("https://db.onlinewebfonts.com/t/1aa3377e489837a26d019bba501e779d.eot?#iefix") format("embedded-opentype"),
           url("https://db.onlinewebfonts.com/t/1aa3377e489837a26d019bba501e779d.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/1aa3377e489837a26d019bba501e779d.woff") format("woff"),

    }

    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #000;
      color: #000;
    }

    /* Typewriter Cursor Animation */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blinking-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background-color: #000;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }

    /* Pill Action Fade Animation */
    .pill-animated {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .pill-animated.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

  <!-- HERO SECTION (z-index: 1) -->

    <div class="max-w-xl relative z-10">
      
      <!-- 1. Blurred Intro Label -->

      <!-- 2. Typewriter Text -->

      <!-- 3. Action Pill Buttons -->

        <!-- 4 White Pill Buttons -->

        </button>

        <button class="pill-btn inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200 cursor-pointer">
          Come work here
        </button>

        <button class="pill-btn inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200 cursor-pointer">
          Send a brief hello
        </button>

        <button class="pill-btn inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200 cursor-pointer">
          See how we operate
        </button>

        <!-- 1 Outline Pill Button (Copy Email) -->
        <button id="copy-email-btn" class="inline-flex items-center justify-center text-white bg-transparent border border-white rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap gap-2 sm:gap-3 hover:bg-white hover:text-black transition-colors duration-200 cursor-pointer">
          <span>Reach us: <span class="underline underline-offset-1">hello@ansh.co</span></span>
          <svg class="w-3 h-3 fill-current shrink-0" viewBox="0 0 16 16">
            <path d="M4 2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H6z"/>
            <path d="M2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1H2z"/>
          </svg>

      </div>

    </div>

  <!-- Interactive JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // =========================================================
      // 1. Ultra-Smooth 60FPS LERP Mouse-Scrub Controlled Video Engine
      // =========================================================
      const video = document.getElementById('scrub-video');
      let prevX = null;
      let targetTime = 0;
      let currentTime = 0;
      let isSeeking = false;
      
      const SENSITIVITY = 0.8;
      const LERP_FACTOR = 0.15; // Smooth damping factor for butter-smooth 60fps motion

      if (video) {
        video.addEventListener('loadedmetadata', () => {
          targetTime = video.duration * 0.2; // Start slightly in
          currentTime = targetTime;
          video.currentTime = targetTime;
        });

        window.addEventListener('mousemove', (e) => {
          if (!video.duration) return;

          if (prevX === null) {
            prevX = e.clientX;
            return;
          }

          const delta = e.clientX - prevX;
          prevX = e.clientX;

          const timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
          targetTime = Math.max(0, Math.min(video.duration, targetTime + timeOffset));
        });

        // Continuous 60fps LERP interpolation loop
        function smoothScrubLoop() {
          if (video.duration) {
            // Smoothly damp towards targetTime
            currentTime += (targetTime - currentTime) * LERP_FACTOR;

            // Only seek if decoder is not currently locked and delta is noticeable
            if (Math.abs(video.currentTime - currentTime) > 0.005 && !isSeeking) {
              isSeeking = true;
              video.currentTime = currentTime;
            }
          }
          requestAnimationFrame(smoothScrubLoop);
        }

        video.addEventListener('seeked', () => {
          isSeeking = false;
        });

        requestAnimationFrame(smoothScrubLoop);
      }

      // ==========================================
      // 2. Typewriter Effect Logic
      // ==========================================
      const fullText = "Glad you stopped in. Good taste tends to find us. Now, what are we building?";
      const typewriterContent = document.getElementById('typewriter-content');
      const typewriterCursor = document.getElementById('typewriter-cursor');
      const speed = 38; // ms per char
      const startDelay = 600; // ms

      let charIndex = 0;

      setTimeout(() => {
        const interval = setInterval(() => {
          if (charIndex < fullText.length) {
            typewriterContent.textContent += fullText.charAt(charIndex);
            charIndex++;
          } else {
            clearInterval(interval);
            if (typewriterCursor) {
              typewriterCursor.style.display = 'none'; // Remove cursor when done
            }
          }
        }, speed);
      }, startDelay);

      // ==========================================
      // 3. Action Pill Buttons Animation (400ms)
      // ==========================================
      const pillContainer = document.getElementById('pill-container');
      setTimeout(() => {
        if (pillContainer) {
          pillContainer.classList.add('visible');
        }
      }, 400);

      // ==========================================
      // 4. Copy Email Handler
      // ==========================================
      const copyEmailBtn = document.getElementById('copy-email-btn');
      if (copyEmailBtn) {
        copyEmailBtn.addEventListener('click', () => {
          const email = "hello@ansh.co";
          navigator.clipboard.writeText(email).then(() => {
            const originalHTML = copyEmailBtn.innerHTML;
            copyEmailBtn.innerHTML = `<span>Copied <strong>${email}</strong>!</span>`;
            setTimeout(() => {
              copyEmailBtn.innerHTML = originalHTML;
            }, 2000);
          }).catch(err => {
            alert('Email: hello@ansh.co');
          });
        });
      }

      // ==========================================
      // 5. Mobile Hamburger Navigation Menu Toggle
      // ==========================================
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const mobileOverlay = document.getElementById('mobile-overlay');
      const barTop = document.getElementById('bar-top');
      const barMid = document.getElementById('bar-mid');
      const barBot = document.getElementById('bar-bot');
      let isOpen = false;

      if (hamburgerBtn && mobileOverlay) {
        hamburgerBtn.addEventListener('click', () => {
          isOpen = !isOpen;
          if (isOpen) {
            mobileOverlay.classList.remove('opacity-0', 'pointer-events-none');
            mobileOverlay.classList.add('opacity-100', 'pointer-events-auto');
            barTop.style.transform = 'translateY(7px) rotate(45deg)';
            barMid.style.opacity = '0';
            barBot.style.transform = 'translateY(-7px) rotate(-45deg)';
          } else {
            mobileOverlay.classList.add('opacity-0', 'pointer-events-none');
            mobileOverlay.classList.remove('opacity-100', 'pointer-events-auto');
            barTop.style.transform = 'none';
            barMid.style.opacity = '1';
            barBot.style.transform = 'none';
          }
        });

        document.querySelectorAll('.mobile-nav-item').forEach(item => {
          item.addEventListener('click', () => {
            isOpen = false;
            mobileOverlay.classList.add('opacity-0', 'pointer-events-none');
            barTop.style.transform = 'none';
            barMid.style.opacity = '1';
            barBot.style.transform = 'none';
          });
        });
      }

    });
  </script>
