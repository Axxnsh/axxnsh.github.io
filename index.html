<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CALL ME IF YOU GET LOST | ID GENERATOR — Get your official traveler passport & license card. Created by Ansh.">
    <title>CALL ME IF YOU GET LOST | ID GENERATOR</title>

    <!-- Google Fonts: Courier Prime & Architects Daughter / Kalam -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        typewriter: ['"Courier Prime"', 'Courier', 'monospace'],
                        handwritten: ['"Architects Daughter"', '"Kalam"', 'cursive'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8F1E5;
            font-family: 'Courier Prime', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* SVG Background Stars */
        .bg-star {
            position: absolute;
            z-index: 0;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Vintage Card Container */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(60, 50, 35, 0.3);
            transition: filter 0.3s ease;
        }

        /* Card Image Base */
        .card-bg-img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
            pointer-events: none;
        }

        /* Overlay Input Fields */
        .overlay-input-handwritten {
            position: absolute;
            background: transparent;
            border: none;
            color: #11100F;
            font-family: 'Architects Daughter', 'Kalam', cursive;
            font-size: clamp(16px, 2.8vw, 28px);
            font-weight: 700;
            outline: none;
            text-align: right;
            line-height: 1;
            padding: 0;
        }

        .overlay-input-handwritten:focus {
            background: rgba(68, 198, 218, 0.1);
            border-radius: 4px;
        }

        .overlay-input-typewriter {
            position: absolute;
            background: transparent;
            border: none;
            color: #11100F;
            font-family: 'Courier Prime', monospace;
            font-size: clamp(12px, 1.8vw, 18px);
            font-weight: 700;
            outline: none;
            text-align: right;
            line-height: 1;
            padding: 0;
        }

        /* Transparent Clickable Overlay Buttons */
        .overlay-btn {
            position: absolute;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            border-radius: 20px;
            transition: background 0.15s ease;
        }

        .overlay-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .overlay-btn:active {
            transform: scale(0.97);
        }

        /* Photo Upload Dropzone */
        .photo-overlay-box {
            position: absolute;
            left: 8.2%;
            top: 15.2%;
            width: 39.5%;
            height: 63.8%;
            cursor: pointer;
            overflow: hidden;
        }

        .uploaded-user-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center min-h-screen p-4 sm:p-8 select-none">

    <!-- BACKGROUND PASTEL STARS -->
    <svg class="bg-star -top-20 -left-20 w-96 h-96 text-[#F6BAC3]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>

    <svg class="bg-star top-10 left-1/3 w-80 h-80 text-[#C1E7D5]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>

    <svg class="bg-star -top-10 -right-20 w-96 h-96 text-[#A0D8EE]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>

    <svg class="bg-star -bottom-20 -left-10 w-[420px] h-[420px] text-[#E8C86A]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>

    <svg class="bg-star -bottom-20 -right-20 w-[450px] h-[450px] text-[#E8C86A]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>

    <!-- TOP HEADER -->
    <header class="relative z-10 w-full max-w-4xl text-center my-2">
        <h1 class="text-xs font-bold tracking-widest text-[#5C5549] uppercase">
            ★ CALL ME IF YOU GET LOST | PASSPORT LICENSE GENERATOR ★
        </h1>
    </header>

    <!-- CENTER CMIYGL VINTAGE PASSPORT CARD -->
    <main class="relative z-10 w-full max-w-[900px] mx-auto my-auto">
        
        <!-- CARD CONTAINER WITH EXACT IMAGE & OVERLAY INPUTS -->
        <div id="cmiygl-card" class="card-container border-2 border-[#1A1815]">
            
            <!-- EXACT CARD BACKGROUND IMAGE -->
            <img id="card-template-img" src="tylerid.png" alt="CMIYGL Passport License Template" class="card-bg-img">

            <!-- 1. PHOTO OVERLAY DROPZONE -->
            <div class="photo-overlay-box">
                <img id="user-uploaded-img" src="" alt="Traveler Photo" class="uploaded-user-img hidden">
                <input type="file" id="photo-file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20" title="Click to upload photo">
            </div>

            <!-- 2. SELECT COLOR BUTTON OVERLAY -->
            <button id="select-color-btn" class="overlay-btn" style="left: 7.8%; bottom: 8.8%; width: 18.5%; height: 6.2%;" title="Select Color Preset"></button>

            <!-- 3. GET YOUR ID BUTTON OVERLAY -->
            <button id="get-id-btn" class="overlay-btn" style="left: 29.2%; bottom: 8.8%; width: 18.5%; height: 6.2%;" title="Get Your ID"></button>

            <!-- 4. OVERLAY INPUT FIELDS -->
            <!-- License No. -->
            <input type="text" id="input-licenseno" value="TTC6252021" class="overlay-input-typewriter" style="right: 8.2%; top: 15.2%; width: 22%;" placeholder="TTC6252021">

            <!-- Name -->
            <input type="text" id="input-name" value="Name" class="overlay-input-handwritten" style="right: 8.2%; top: 20.8%; width: 32%;" placeholder="Name">

            <!-- Date of Birth -->
            <input type="text" id="input-dob" value="Date of Birth" class="overlay-input-handwritten" style="right: 8.2%; top: 27.2%; width: 32%;" placeholder="Date of Birth">

            <!-- Location / Place of Issue -->
            <input type="text" id="input-location" value="Location" class="overlay-input-handwritten" style="right: 8.2%; top: 33.6%; width: 32%;" placeholder="Location">

            <!-- Date of Issue -->
            <input type="text" id="input-issuedate" value="06/25/2021" class="overlay-input-handwritten" style="right: 8.2%; top: 40.0%; width: 32%;" placeholder="06/25/2021">

            <!-- Signature -->
            <input type="text" id="input-signature" value="SIGN HERE" class="overlay-input-handwritten" style="right: 8.2%; bottom: 12.8%; width: 36%; font-size: clamp(18px, 3vw, 32px);" placeholder="SIGN HERE">

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="relative z-10 text-center text-xs font-bold text-[#5C5549] font-typewriter my-3">
        Created by <a href="https://ansh.com" target="_blank" class="text-[#1A1815] underline hover:text-[#44C6DA]">Ansh.com</a> &bull; Published live on <a href="https://axxnsh.github.io" class="text-[#1A1815] underline hover:text-[#44C6DA]">axxnsh.github.io</a>
    </footer>

    <!-- HIDDEN EXPORT CANVAS FOR PNG DOWNLOAD -->
    <canvas id="export-canvas" width="1200" height="742" class="hidden"></canvas>

    <!-- JAVASCRIPT CONTROLS & DOWNLOAD ENGINE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const cardTemplateImg = document.getElementById('card-template-img');
            const userUploadedImg = document.getElementById('user-uploaded-img');
            const photoFileInput = document.getElementById('photo-file-input');
            const selectColorBtn = document.getElementById('select-color-btn');
            const getIdBtn = document.getElementById('get-id-btn');
            const cmiyglCard = document.getElementById('cmiygl-card');

            // Inputs
            const inputName = document.getElementById('input-name');
            const inputDob = document.getElementById('input-dob');
            const inputLocation = document.getElementById('input-location');
            const inputIssuedate = document.getElementById('input-issuedate');
            const inputLicenseno = document.getElementById('input-licenseno');
            const inputSignature = document.getElementById('input-signature');

            // Filter Color presets on the template image
            const filterPresets = [
                'none',
                'hue-rotate(300deg) saturate(1.2)', // Pinkish
                'hue-rotate(90deg) saturate(1.2)',  // Greenish
                'hue-rotate(45deg) saturate(1.3)',  // Golden
                'sepia(0.4) contrast(1.1)'          // Vintage Sepia
            ];
            let filterIndex = 0;

            selectColorBtn.addEventListener('click', () => {
                filterIndex = (filterIndex + 1) % filterPresets.length;
                cmiyglCard.style.filter = filterPresets[filterIndex];
            });

            // Photo Upload handler
            photoFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        userUploadedImg.src = event.target.result;
                        userUploadedImg.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            // HD Download Engine (Render exact template image + user uploaded photo + user typed text onto 1200x742 Canvas)
            getIdBtn.addEventListener('click', () => {
                const canvas = document.getElementById('export-canvas');
                const ctx = canvas.getContext('2d');
                const W = 1200;
                const H = 742;

                // 1. Draw exact base template image
                ctx.filter = cmiyglCard.style.filter || 'none';
                ctx.drawImage(cardTemplateImg, 0, 0, W, H);
                ctx.filter = 'none';

                // 2. Draw user photo if uploaded over the photo frame area
                if (userUploadedImg && !userUploadedImg.classList.contains('hidden') && userUploadedImg.complete && userUploadedImg.src) {
                    const px = 98, py = 113, pw = 474, ph = 473;
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(px, py, pw, ph);
                    ctx.clip();
                    ctx.drawImage(userUploadedImg, px, py, pw, ph);
                    ctx.restore();
                }

                // 3. Draw text fields at exact high-res canvas positions
                ctx.fillStyle = "#11100F";
                ctx.textAlign = "right";

                // License No.
                ctx.font = "bold 24px 'Courier Prime', monospace";
                ctx.fillText((inputLicenseno.value || "TTC6252021").toUpperCase(), W - 100, 126);

                // Handwritten Fields
                ctx.font = "700 38px 'Architects Daughter', cursive";
                ctx.fillText(inputName.value || "Name", W - 100, 178);
                ctx.fillText(inputDob.value || "Date of Birth", W - 100, 226);
                ctx.fillText(inputLocation.value || "Location", W - 100, 274);
                ctx.fillText(inputIssuedate.value || "06/25/2021", W - 100, 322);

                // Signature
                ctx.font = "700 42px 'Architects Daughter', cursive";
                ctx.fillText(inputSignature.value || "SIGN HERE", W - 100, 630);

                // Download Link Trigger
                const link = document.createElement('a');
                link.download = `CMIYGL_License_${(inputName.value || "Traveler").replace(/\s+/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

        });
    </script>

</body>
</html>
